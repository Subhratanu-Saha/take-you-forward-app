name: Deploy to Render Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run build check
        run: npm run build

      - name: Deploy to Render Server
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
